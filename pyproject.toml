[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-sam-audio"
version = "0.1.0"
description = "Model Compression Pipeline: SAM-Audio to Mini-SAM-Audio"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sam-audio @ file://./sam-audio",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/sam-audio"
Repository = "https://github.com/facebookresearch/sam-audio"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mini_sam_audio*"]

[tool.setuptools.package-data]
mini_sam_audio = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "C",
    "E",
    "W",
    "F",
    "I",
]
ignore = [
    "E501",
    "E731",
    "C901",
    "B006",
]
